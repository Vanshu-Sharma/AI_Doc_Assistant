
# Alembic configuration for AI Document Assistant

[alembic]

# Location of migration scripts
script_location = %(here)s/alembic

# Add project root to Python path
prepend_sys_path = .

# Path separator for version locations
path_separator = os

# Database connection URL
# Docker Compose service name: db
sqlalchemy.url = postgresql+psycopg://postgres:MyNewPass123!@db:5432/ai_doc_db


[post_write_hooks]
# Optional formatting hooks for generated migrations
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
