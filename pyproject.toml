[project]
name = "ai-doc-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.0.0",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes (unused imports, undefined variables, syntax)
]
ignore = [
    "E501",  # line length
]
